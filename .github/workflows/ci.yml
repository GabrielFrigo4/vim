name: Universal Vim CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    validate:
        name: 🔍 Vim Configuration Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Vim
              run: |
                  sudo apt-get update
                  sudo apt-get install -y vim-nox

            - name: Test Headless Startup
              run: |
                  vim -u vimrc -es -c "quit"
